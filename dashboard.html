<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash-Flow Tracker</title>

     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Cash-Flow Tracker</h1>

    <section>

    <h2>Set Salary</h2>

    <div class="input-row">

        <input
            type="number"
            id="salary-field"
            placeholder="Enter salary">

        <button id="salary-button">
            Set Salary
        </button>

    </div>

</section>

    <section>

        <h2>Summary</h2>

        <p>Total Salary: ₹<span id="salary-display">0</span></p>
        <p>Total Expenses: ₹<span id="expense-display">0</span></p>
        <p>Remaining Balance: ₹<span id="balance-display">0</span></p>

    </section>

    
    <section>

    <h2>Add Expense</h2>

    <div class="input-row">

        <input
            type="text"
            id="expense-name"
            placeholder="Expense name">

        <input
            type="number"
            id="expense-amount"
            placeholder="Expense amount">

        <button id="expense-button">
            Add Expense
        </button>

    </div>

</section>

    
    <section>

        <h2>Expenses</h2>

        <ul id="expense-list"></ul>

    </section>

    
    <p id="error-message"></p>

    <script src="script.js"></script>

</body>

</html>
